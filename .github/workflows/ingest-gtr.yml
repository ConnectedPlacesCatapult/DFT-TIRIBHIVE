# Manual GtR -> atlas.projects ingestion (no schedule).
# Add repo secret: DATABASE_URL (Supabase transaction pooler URI, port 6543).

name: GtR Atlas Ingestion

on:
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements-atlas.txt

      - name: Run GtR ingestion
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/ingest_gtr.py
